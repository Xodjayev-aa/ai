# End-to-end check against a *real deployed* environment with ZERO API keys.
#
# What it does:
#   1. waits for the Vercel preview deployment attached to the pushed commit
#   2. runs tests/e2e_preview.py against it: auth, keyless chat (SSE),
#      presentations (+ .pptx and HTML export), images, voice/TTS
#   3. prints a human-readable summary into the workflow summary
#
# It is non-blocking for the deployment itself (Vercel ships the build);
# a red X here means "the live product is broken", which is exactly what we
# want to catch before merging.
name: E2E (preview)

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL to test (blank = auto-detect preview for this commit)"
        required: false
        default: ""
  push:
    branches:
      - "arena/**"
      - main

permissions:
  contents: read
  deployments: read
  statuses: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test deps
        run: pip install --quiet httpx python-pptx

      - name: Wait for the Vercel deployment of this commit
        id: target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          manual="${{ github.event.inputs.base_url || '' }}"
          if [ -n "$manual" ]; then
            echo "base_url=$manual" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python tests/wait_for_preview.py --repo "${{ github.repository }}" \
            --sha "${{ github.sha }}" --github-output "$GITHUB_OUTPUT"

      - name: Run keyless E2E suite
        env:
          AETHER_BASE_URL: ${{ steps.target.outputs.base_url }}
        run: |
          echo "Testing: $AETHER_BASE_URL"
          python tests/e2e_preview.py --base-url "$AETHER_BASE_URL"
